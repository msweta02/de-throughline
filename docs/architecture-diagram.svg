<svg viewBox="0 0 1180 860" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b45309"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="860" fill="#ffffff"/>

  <!-- Rule: one line, top -->
  <text x="590" y="34" text-anchor="middle" font-size="16" fill="#475569" font-style="italic">
    Throughline reads the pipeline's data, and writes only its own.
  </text>

  <!-- ================= WORKER BOX ================= -->
  <rect x="40" y="64" width="500" height="260" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="60" y="94" font-size="15" font-weight="700" fill="#0f172a" letter-spacing="0.5">AIRFLOW WORKER</text>

  <rect x="64" y="112" width="452" height="188" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="84" y="138" font-size="14" fill="#334155" font-family="'Cascadia Code','JetBrains Mono',monospace">your task</text>

  <rect x="84" y="152" width="412" height="130" rx="6" fill="#ecfeff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="104" y="176" font-size="13.5" fill="#0f766e" font-family="'Cascadia Code','JetBrains Mono',monospace" font-weight="600">@throughline.trace</text>
  <text x="104" y="200" font-size="13" fill="#0f172a">1&#8201;&#8201;snapshot the input</text>
  <text x="104" y="222" font-size="13" fill="#0f172a">2&#8201;&#8201;run the real task body</text>
  <text x="104" y="244" font-size="13" fill="#0f172a">3&#8201;&#8201;snapshot the output</text>
  <text x="104" y="268" font-size="12" fill="#64748b" font-style="italic">never raises into the task</text>

  <!-- ================= API SERVER BOX ================= -->
  <rect x="640" y="64" width="500" height="260" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="660" y="94" font-size="15" font-weight="700" fill="#0f172a" letter-spacing="0.5">AIRFLOW API SERVER</text>
  <text x="1120" y="94" font-size="11.5" fill="#64748b" text-anchor="end">mounted in-process by fastapi_apps</text>

  <g font-family="'Cascadia Code','JetBrains Mono',monospace" font-size="13.5">
    <rect x="664" y="112" width="452" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/>
    <text x="684" y="138" fill="#0f172a" font-weight="600">api.py</text>
    <text x="800" y="138" fill="#475569" font-family="'Segoe UI',sans-serif" font-size="12.5">FastAPI binding, nothing else</text>

    <rect x="664" y="160" width="452" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/>
    <text x="684" y="186" fill="#0f172a" font-weight="600">views.py</text>
    <text x="800" y="186" fill="#475569" font-family="'Segoe UI',sans-serif" font-size="12.5">pages as plain HTML strings</text>

    <rect x="664" y="208" width="452" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/>
    <text x="684" y="234" fill="#0f172a" font-weight="600">grid.py</text>
    <text x="800" y="234" fill="#475569" font-family="'Segoe UI',sans-serif" font-size="12.5">grid + shape strip</text>

    <rect x="664" y="256" width="452" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/>
    <text x="684" y="282" fill="#0f172a" font-weight="600">replay.py</text>
    <text x="800" y="282" fill="#475569" font-family="'Segoe UI',sans-serif" font-size="12.5">re-execute one record</text>
  </g>

  <!-- ================= ARROWS DOWN FROM BOXES ================= -->
  <!-- worker -> warehouse -->
  <path d="M170,324 L170,470" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <text x="182" y="400" font-size="12.5" fill="#334155">the task</text>
  <text x="182" y="416" font-size="12.5" fill="#334155">writes</text>

  <!-- worker -> throughline.duckdb -->
  <path d="M420,324 C420,400 560,400 560,470" stroke="#0d9488" stroke-width="2" marker-end="url(#arrowTeal)" fill="none"/>
  <text x="575" y="430" font-size="12.5" fill="#0f766e">Throughline</text>
  <text x="575" y="446" font-size="12.5" fill="#0f766e">writes</text>

  <!-- api server -> throughline.duckdb -->
  <path d="M890,324 L890,470" stroke="#0d9488" stroke-width="2" marker-end="url(#arrowTeal)" fill="none"/>
  <text x="902" y="400" font-size="12.5" fill="#0f766e">reads only</text>

  <!-- ================= WAREHOUSE CYLINDER ================= -->
  <g>
    <path d="M70,480 v120 a90,16 0 0 0 180,0 v-120" fill="#fff7ed" stroke="#334155" stroke-width="2"/>
    <ellipse cx="160" cy="480" rx="90" ry="16" fill="#ffedd5" stroke="#334155" stroke-width="2"/>
    <text x="160" y="540" text-anchor="middle" font-size="13.5" font-family="'Cascadia Code','JetBrains Mono',monospace" font-weight="600" fill="#0f172a">warehouse.duckdb</text>
    <text x="160" y="562" text-anchor="middle" font-size="11.5" fill="#78716c" font-family="'Cascadia Code','JetBrains Mono',monospace">wh.orders &#8230;</text>
  </g>

  <!-- ================= THROUGHLINE.DUCKDB BOX ================= -->
  <rect x="420" y="470" width="480" height="130" rx="8" fill="#ecfeff" stroke="#0d9488" stroke-width="2"/>
  <text x="440" y="496" font-size="13.5" font-family="'Cascadia Code','JetBrains Mono',monospace" font-weight="700" fill="#0f172a">throughline.duckdb</text>
  <line x1="440" y1="506" x2="880" y2="506" stroke="#99f6e4" stroke-width="1"/>
  <text x="440" y="530" font-size="12.5" font-family="'Cascadia Code','JetBrains Mono',monospace" fill="#0f172a">capture.captures</text>
  <text x="600" y="530" font-size="12" fill="#0f766e" font-style="italic">one row per field</text>
  <text x="440" y="556" font-size="12.5" font-family="'Cascadia Code','JetBrains Mono',monospace" fill="#0f172a">capture.replays</text>
  <text x="600" y="556" font-size="12" fill="#0f766e" font-style="italic">one row per attempt</text>
  <text x="440" y="584" font-size="11.5" fill="#64748b">written by the worker&#8217;s decorator; read by every API-server page</text>

  <!-- ================= REPLAY PATH (dashed, amber) ================= -->
  <path d="M160,616 C160,700 250,743 345,743" stroke="#b45309" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowAmber)"/>
  <rect x="330" y="620" width="420" height="150" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="350" y="646" font-size="13" fill="#92400e" font-weight="600">During a replay only</text>
  <text x="350" y="670" font-size="12.5" fill="#78350f">warehouse is attached <tspan font-family="'Cascadia Code','JetBrains Mono',monospace" font-weight="600">READ_ONLY</tspan></text>
  <text x="350" y="692" font-size="12.5" fill="#78350f">the task still runs and still tries to write &#8212;</text>
  <text x="350" y="714" font-size="12.5" fill="#78350f">its writes land here instead:</text>
  <rect x="350" y="726" width="290" height="34" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.25"/>
  <text x="365" y="748" font-size="12.5" font-family="'Cascadia Code','JetBrains Mono',monospace" fill="#78350f">scratch/&lt;replay_id&gt;.duckdb</text>

  <!-- ================= BOTTOM NOTE ================= -->
  <text x="590" y="820" text-anchor="middle" font-size="12.5" fill="#64748b">
    Both boxes are ordinary Airflow processes &#8212; there is no Throughline daemon.
  </text>
  <text x="590" y="840" text-anchor="middle" font-size="12.5" fill="#64748b">
    The record itself never travels between tasks: XCom carries only a ~70-byte handle naming a relation.
  </text>
</svg>
