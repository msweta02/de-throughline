<svg viewBox="0 0 1180 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1180" height="300" fill="#ffffff"/>

  <!-- Card -->
  <rect x="16" y="16" width="1148" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.25"/>

  <g font-family="'Cascadia Code','JetBrains Mono',monospace" font-size="16">
    <!-- Column headers -->
    <text x="220" y="52" font-weight="700" fill="#0f172a">extract</text>
    <text x="460" y="52" font-weight="700" fill="#0f172a">normalize</text>
    <text x="700" y="52" font-weight="700" fill="#0f172a">apply_promo</text>
    <text x="940" y="52" font-weight="700" fill="#0f172a">compute_total</text>
    <line x1="40" y1="64" x2="1140" y2="64" stroke="#e2e8f0" stroke-width="1"/>

    <!-- rows -->
    <text x="40" y="90" font-family="'Segoe UI',sans-serif" fill="#334155">rows</text>
    <text x="220" y="90" fill="#0f172a">1</text>
    <text x="460" y="90" fill="#0f172a">1 &#8594; 1</text>
    <text x="700" y="90" fill="#b45309" font-weight="700">1 &#8594; 2</text>
    <text x="940" y="90" fill="#0f172a">2 &#8594; 2</text>

    <!-- added -->
    <text x="40" y="116" font-family="'Segoe UI',sans-serif" fill="#334155">added</text>
    <text x="460" y="116" fill="#0f766e">+ordered_at</text>
    <text x="700" y="116" fill="#0f766e">+promo_code</text>
    <text x="940" y="116" fill="#0f766e">+line_total</text>
    <text x="460" y="140" fill="#0f766e">+unit_price</text>
    <text x="700" y="140" fill="#0f766e">+discount_pct</text>
    <text x="940" y="140" fill="#0f766e">+total_discount_pct</text>

    <!-- dropped -->
    <text x="40" y="172" font-family="'Segoe UI',sans-serif" fill="#334155">dropped</text>
    <text x="460" y="172" fill="#9f1239">&#8722;order_ts</text>
    <text x="460" y="196" fill="#9f1239">&#8722;sku</text>

    <!-- caption -->
    <text x="40" y="240" font-style="italic" fill="#475569" font-size="15">
      rows 1&#8594;2 at apply_promo: a join fanned out. Now you know which task, and where to look.
    </text>
  </g>
</svg>
